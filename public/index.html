<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte Financeiro LJCF</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2rem;
        }
        
        p {
            margin-bottom: 15px;
            color: #555;
        }
        
        .status {
            background: #f0f4f8;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .status-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #48bb78;
            margin-right: 10px;
        }
        
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            color: #718096;
            font-size: 0.875rem;
        }
    </style>
    
    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { 
            (window.vaq = window.vaq || []).push(arguments); 
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <div class="container">
        <h1>🏦 Suporte Financeiro LJCF</h1>
        <p>Sistema de suporte financeiro com processamento de tarefas em segundo plano.</p>
        
        <div class="status">
            <h2 style="margin-bottom: 15px; color: #2d3748;">Status do Sistema</h2>
            <div class="status-item">
                <div class="status-icon"></div>
                <span>Celery Worker: Ativo</span>
            </div>
            <div class="status-item">
                <div class="status-icon"></div>
                <span>Redis Backend: Conectado</span>
            </div>
            <div class="status-item">
                <div class="status-icon"></div>
                <span>Vercel Analytics: Configurado</span>
            </div>
        </div>
        
        <div class="footer">
            <p>Powered by Celery, Redis, and Vercel</p>
            <p>© 2026 LJCF - Todos os direitos reservados</p>
        </div>
    </div>
</body>
</html>
